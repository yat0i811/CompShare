# compshare-frontend は SPA を配信せず、compshare-web（Next.js）と
# compshare-backend（FastAPI）への純粋なリバースプロキシとして動作する。

# WebSocket 用。$http_upgrade が空の通常リクエストにまで Connection: upgrade を付けると
# upstream の keep-alive が無効化され、ASGI サーバによっては接続を拒否される。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3001;
    server_name _;

    # Docker 埋め込み DNS で遅延解決する（コンテナ再作成時の IP 固着を防ぐ）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://compshare-backend:8001;
    set $webapp  http://compshare-web:3004;

    # 動画アップロードがあるため大きめに。backend/middlewares.py の
    # ConditionalUploadLimitMiddleware（外部アクセス時 1GB 制限）に合わせる。
    client_max_body_size 1024m;

    # バックエンド API（/be/* → backend の * へプレフィックスを除去して中継）。
    # WebSocket（/be/ws/<client_id>）もこの location を通る。
    # proxy_pass に変数（$backend）を使う場合、URI 部分は書けない仕様のため、
    # rewrite ... break で /be プレフィックスを外してから渡す。
    location /be/ {
        rewrite ^/be/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # 圧縮処理は時間がかかるため長めに設定
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # アップロードをストリーミングし、nginx 側でバッファしない
        proxy_request_buffering off;
    }

    # 公開ヘルスチェック（プラットフォーム標準は /healthz。APP_STANDARD.md 参照）。
    # ここで return 200 にしないこと。nginx 単体で完結させると Next.js が停止しても
    # 監視が緑のままになり、検知能力が後退する。必ず Next.js まで通すこと。
    # proxy_pass に変数を使うと URI 部を書けない仕様のため rewrite ... break を使う。
    location = /healthz {
        rewrite ^/healthz$ /api/healthz break;
        proxy_pass $webapp;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 本体（SSR アプリ + ページ内 API ルート）
    location / {
        proxy_pass $webapp;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
